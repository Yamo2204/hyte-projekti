<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyteGym - Login</title>
  <style>
    :root {
      --dark: #1f2a30;
      --accent: #3bc4d6;
      --bg: #f4f6f8;
      --text: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .navbar-wrap {
      background: var(--dark);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--accent);
      font-weight: 800;
      font-size: 22px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #c9c9c9;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: #fff;
    }

    .auth-wrap {
      max-width: 520px;
      margin: 48px auto;
      background: #fff;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #2a4b7c;
      font-size: 26px;
    }

    p {
      margin-top: 0;
      margin-bottom: 18px;
      color: #52606d;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      padding: 11px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
    }

    #loginStatus {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="navbar-wrap">
    <div class="navbar">
      <div class="logo">HyteGym</div>
      <div class="nav-links">
        <a href="index.html">Koti</a>
        <a href="items-page.html">Items</a>
        <a href="bmi.html">BMI-laskin</a>
        <a href="diary.html">Päiväkirja</a>
        <a class="active" href="login.html">Login</a>
      </div>
    </div>
  </div>

  <main class="auth-wrap">
    <h1>Kirjaudu sisään</h1>
    <p>Tämä tallentaa JWT-tokenin selaimen localStorageen.</p>

    <form id="loginForm">
      <label for="username">Käyttäjätunnus</label>
      <input id="username" name="username" type="text" placeholder="esim. opiskelija" required />

      <label for="password">Salasana</label>
      <input id="password" name="password" type="password" placeholder="salasana" required />

      <button type="submit">Login</button>
    </form>

    <div id="loginStatus"></div>
  </main>

  <script type="module" src="/js/auth-nav.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
