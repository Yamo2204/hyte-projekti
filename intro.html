<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HyteGym - مقدمة</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2a30 0%, #3bc4d6 100%);
      font-family: Arial, Tahoma, sans-serif;
      cursor: pointer;
    }

    .intro-container {
      text-align: center;
      animation: fadeIn 1s ease-in;
    }

    .intro-title {
      font-size: 72px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      letter-spacing: 2px;
    }

    .intro-subtitle {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      font-weight: 300;
    }

    .intro-click {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      animation: pulse 2s infinite;
      margin-top: 60px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    .intro-container:hover {
      transform: scale(1.05);
      transition: all 0.3s ease;
    }

  </style>
</head>

<body>

  <div class="intro-container" onclick="goToHome()">
    <div class="intro-title">HyteGym</div>
  </div>

  <script>
    function goToHome() {
      window.location.href = 'index.html';
    }


    // setTimeout(() => {
    //   window.location.href = 'index.html';
    // }, 3000);
  </script>

</body>
</html>
