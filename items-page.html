<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Harjoitukset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f4f4;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #555;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        
        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Console Output */
        .console-output {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        /* List */
        ul {
            list-style: none;
        }
        
        ul li {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #007bff;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        /* Buttons */
        button {
            padding: 10px 20px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        button.primary {
            background: #007bff;
            color: white;
        }
        
        button.success {
            background: #28a745;
            color: white;
        }
        
        button.danger {
            background: #dc3545;
            color: white;
        }
        
        /* Snackbar */
        #snackbar {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
        }
        
        #snackbar.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        
        #snackbar.success {
            background-color: #28a745;
        }
        
        #snackbar.error {
            background-color: #dc3545;
        }
        
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>
    <!-- Tehtävä 1: Hae kaikki users ja tulosta konsoliin sekä listaan -->
    <div class="section">
        <h2>1. GET - Hae kaikki users</h2>
        <p>Hae kaikki users tiedot omasta backendista ja printaa tulos konsoliin. Tämän jälkeen luo users lista alle.</p>
        
        <button class="primary" onclick="getAllUsers()">Get all users</button>
        
        <h3>Console Output:</h3>
        <div class="console-output" id="consoleOutput">Paina "Get all users" -nappia...</div>
        
        <h3>Users Lista:</h3>
        <ul id="usersList"></ul>
    </div>
    
    <!-- Tehtävä 2: Hae ja poista yksittäinen user formilla -->
    <div class="section">
        <h2>2. GET & DELETE - Hae tai poista user ID:llä</h2>
        
        <div class="form-group">
            <label for="userId">User ID:</label>
            <input type="number" id="userId" placeholder="Syötä user ID (esim. 1)">
        </div>
        
        <button class="success" onclick="getUserById()">Hae user</button>
        <button class="danger" onclick="deleteUser()">Poista user</button>
    </div>
    
    <!-- Snackbar viestit -->
    <div id="snackbar"></div>

    <script>
        const API_URL = 'http://localhost:3000/api/users';
        
        // ===== Snackbar Funktiot =====
        function showSnackbar(message, type = 'success') {
            const snackbar = document.getElementById('snackbar');
            snackbar.textContent = message;
            snackbar.className = `show ${type}`;
            
            setTimeout(() => {
                snackbar.className = snackbar.className.replace('show', '');
            }, 3000);
        }
        
        // Console output helper
        function addToConsole(message, isError = false) {
            const consoleOutput = document.getElementById('consoleOutput');
            const color = isError ? '#ff6b6b' : '#00ff00';
            consoleOutput.innerHTML += `<div style="color: ${color};">${message}</div>`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        // ===== 1. GET - Hae kaikki users =====
        async function getAllUsers() {
            const consoleOutput = document.getElementById('consoleOutput');
            consoleOutput.innerHTML = '';
            
            addToConsole('GET http://localhost:3000/api/users');
            console.log('Haetaan kaikki users...');
            
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const users = await response.json();
                console.log('Users:', users);
                
                // Tulosta konsoliin
                users.forEach((user, index) => {
                    const userText = `User ${index + 1}: ${user.username} - ${user.email}`;
                    console.log(userText);
                    addToConsole(userText);
                });
                
                // Renderöi lista
                renderUsersList(users);
                showSnackbar('Users haettu onnistuneesti!', 'success');
                
            } catch (error) {
                console.error('Virhe:', error);
                addToConsole(`❌ Virhe: ${error.message}`, true);
                showSnackbar('Virhe haettaessa users!', 'error');
            }
        }
        
        // Renderöi users lista
        function renderUsersList(users) {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';
            
            users.forEach((user) => {
                const li = document.createElement('li');
                li.textContent = `ID: ${user.user_id} - ${user.username} - ${user.email}`;
                usersList.appendChild(li);
            });
        }
        
        // ===== 2. GET - Hae user ID:llä =====
        async function getUserById() {
            const userId = document.getElementById('userId').value;
            
            if (!userId) {
                showSnackbar('Syötä User ID!', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/${userId}`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'User ei löydy');
                }
                
                console.log('User löydetty:', data);
                alert(`✅ User löydetty!\n\nID: ${data.user_id}\nUsername: ${data.username}\nEmail: ${data.email}`);
                showSnackbar('User löydetty!', 'success');
                
            } catch (error) {
                console.error('Virhe:', error);
                showSnackbar(error.message, 'error');
            }
        }
        
        // ===== DELETE - Poista user =====
        async function deleteUser() {
            const userId = document.getElementById('userId').value;
            
            if (!userId) {
                showSnackbar('Syötä User ID!', 'error');
                return;
            }
            
            if (!confirm(`Haluatko varmasti poistaa userin ID: ${userId}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/${userId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Poisto epäonnistui');
                }
                
                console.log('User poistettu:', data);
                showSnackbar(data.message || 'User poistettu!', 'success');
                
                // Päivitä lista
                getAllUsers();
                
            } catch (error) {
                console.error('Virhe:', error);
                showSnackbar(error.message, 'error');
            }
        }
        
        // Lataa users automaattisesti sivun latautuessa
        window.addEventListener('load', () => {
            getAllUsers();
        });
    </script>
</body>
</html>
