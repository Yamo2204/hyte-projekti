<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyteGym - Päiväkirja</title>
  <style>
    :root {
      --dark: #1f2a30;
      --accent: #3bc4d6;
      --bg: #f4f6f8;
      --text: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .navbar-wrap {
      background: var(--dark);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--accent);
      font-weight: 800;
      font-size: 22px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #c9c9c9;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: #fff;
    }

    .content {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px 24px;
    }

    h1 {
      margin-bottom: 10px;
      color: #1f2933;
      font-size: 30px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
    }

    #logoutBtn {
      background: #5f6c7b;
    }

    #status {
      margin: 10px 0 20px;
      font-weight: 700;
      color: #2a4b7c;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: stretch;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.11);
      overflow: hidden;
      width: min(100%, 300px);
      flex: 1 1 280px;
    }

    .card img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 14px;
      line-height: 1.5;
    }

    .card-body p {
      margin: 2px 0;
      font-size: 15px;
    }

    .note {
      margin-top: 8px;
      color: #52606d;
    }
  </style>
</head>
<body>
  <div class="navbar-wrap">
    <div class="navbar">
      <div class="logo">HyteGym</div>
      <div class="nav-links">
        <a href="index.html">Koti</a>
        <a href="items-page.html">Items</a>
        <a href="bmi.html">BMI-laskin</a>
        <a class="active" href="diary.html">Päiväkirja</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <main class="content">
    <h1>Flexboxilla tehty kortti + Fetch + Itse luodut elementit</h1>

    <div class="actions">
      <button id="fetchEntriesBtn">Hae päiväkirjamerkinnät</button>
      <button id="logoutBtn">Uloskirjaudu</button>
    </div>

    <div id="status">Kirjaudu ensin sisään, jotta token on localStoragessa.</div>

    <section id="entriesContainer" class="cards"></section>
  </main>

  <script type="module" src="/js/auth-nav.js"></script>
  <script type="module" src="/js/diary.js"></script>
</body>
</html>
