<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <p>Backend URL: <strong>http://localhost:3000</strong></p>

    <div class="test-section">
        <h2>Test Endpoints</h2>
        <button onclick="testEndpoint('/api/users')">Test /api/users</button>
        <button onclick="testEndpoint('/api/entries')">Test /api/entries</button>
        <button onclick="testEndpoint('/api/medications')">Test /api/medications</button>
        <button onclick="testEndpoint('/api/exercises')">Test /api/exercises</button>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        async function testEndpoint(endpoint) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = `Testing ${endpoint}...`;

            try {
                const response = await fetch(API_URL + endpoint);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Success! Status: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Error: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Connection Error:\n${error.message}\n\nMake sure backend is running on ${API_URL}`;
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            testEndpoint('/api/users');
        });
    </script>
</body>
</html>
